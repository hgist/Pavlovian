<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>Pavlovian — Drawer Open</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:       #FBF7EE;
    --paper-light: #FFFDF7;
    --ink:         #2A2723;
    --ink-muted:   #6B655C;
    --ink-hair:    #B7AD9B;
    --terracotta:  #E8A07A;
    --warning:     #A8401A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F0EEE9;
    display: flex; justify-content: center; padding: 24px 0;
    font-family: 'Patrick Hand', cursive; color: var(--ink);
  }
  .phone {
    width: 370px; min-height: 740px;
    background: var(--paper);
    border: 3px solid var(--ink); border-radius: 32px;
    overflow: hidden;
    box-shadow: 6px 6px 0 rgba(42,39,35,.15);
    display: flex; flex-direction: column;
    position: relative;
  }

  /* ── Dimmed main content behind the drawer ── */
  .main-behind {
    flex: 1; display: flex; flex-direction: column;
    filter: brightness(0.85);
    pointer-events: none;
  }
  .header { display: flex; align-items: flex-start; padding: 16px 14px 8px 12px; }
  .hamburger { font-size: 22px; margin-right: 6px; margin-top: 2px; color: var(--ink); }
  .header-text { flex: 1; }
  .header-text h1 { font-family: 'Architects Daughter', cursive; font-size: 22px; letter-spacing: .3px; font-weight: normal; }
  .header-text .sub { font-size: 12px; color: var(--ink-muted); }
  .all-switch { text-align: center; }
  .pill-switch { width: 44px; height: 24px; border: 2px solid var(--ink); border-radius: 999px; position: relative; background: var(--terracotta); }
  .pill-dot { width: 17px; height: 17px; background: var(--ink); border-radius: 50%; position: absolute; top: 1.5px; right: 2px; }
  .all-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-muted); letter-spacing: .5px; margin-top: 2px; }
  .day-chips { display: flex; gap: 4px; padding: 6px 10px 0; }
  .day-chip { flex: 1; text-align: center; padding: 4px 0; border: 2px solid var(--ink); border-radius: 999px; font-size: 13px; white-space: nowrap; }
  .day-chip.active { background: rgba(232,160,122,.25); font-weight: 600; }
  .day-chip.off { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-hair); text-decoration: line-through; }

  /* ── Scrim overlay ── */
  .scrim {
    position: absolute; inset: 0;
    background: rgba(42,39,35,.35);
    pointer-events: none;
  }

  /* ── Drawer panel ── */
  .drawer {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 280px;
    background: var(--paper-light);
    display: flex; flex-direction: column;
    box-shadow: 4px 0 16px rgba(42,39,35,.18);
  }

  /* Drawer header */
  .drawer-header {
    background: var(--paper);
    padding: 20px 20px 18px;
  }
  .bell-circle-sm {
    width: 52px; height: 52px;
    border: 2px solid var(--ink); border-radius: 50%;
    background: var(--paper-light);
    box-shadow: 2px 2px 0 rgba(42,39,35,.12);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .drawer-app-name {
    font-family: 'Architects Daughter', cursive;
    font-size: 24px; letter-spacing: .3px; color: var(--ink);
  }
  .drawer-tagline { font-size: 13px; color: var(--ink-muted); margin-top: 2px; }
  .drawer-byline  { font-family: 'Caveat', cursive; font-size: 13px; color: var(--ink-hair); letter-spacing: .5px; }

  .dashed-div {
    margin: 0 18px;
    border: none; border-top: 1.5px dashed var(--ink-hair);
  }

  /* Settings item */
  .drawer-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px;
    cursor: pointer;
  }
  .drawer-item:hover { background: rgba(232,160,122,.08); }
  .drawer-item .icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--ink-muted); }
  .drawer-item .item-label { flex: 1; font-size: 16px; }
  .drawer-item .chev { font-family: 'Caveat', cursive; font-size: 18px; color: var(--ink-hair); }

  .drawer-spacer { flex: 1; }

  /* Footer */
  .drawer-credits {
    padding: 12px 18px;
    font-family: 'Caveat', cursive;
    font-size: 13px; color: var(--ink-muted);
    letter-spacing: .2px; line-height: 1.2;
  }
  .drawer-version {
    padding: 12px 18px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ink-hair); letter-spacing: .8px;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- Dimmed main content visible through scrim -->
  <div class="main-behind">
    <div class="header">
      <span class="hamburger">☰</span>
      <div class="header-text">
        <h1>Timers</h1>
        <div class="sub">3 of 3 active · Thursday</div>
      </div>
      <div class="all-switch">
        <div class="pill-switch"><div class="pill-dot"></div></div>
        <div class="all-label">ALL ON</div>
      </div>
    </div>
    <div class="day-chips">
      <div class="day-chip">Sun</div>
      <div class="day-chip">Mon</div>
      <div class="day-chip">Tue</div>
      <div class="day-chip">Wed</div>
      <div class="day-chip active">Thu</div>
      <div class="day-chip off">Fri</div>
      <div class="day-chip off">Sat</div>
    </div>
  </div>

  <!-- Scrim -->
  <div class="scrim"></div>

  <!-- Drawer -->
  <div class="drawer">

    <!-- Header -->
    <div class="drawer-header">
      <div class="bell-circle-sm">
        <svg width="34" height="34" viewBox="0 0 80 80" fill="none">
          <path d="M40,10 C26,10 18,22 17,36 C16,46 14,52 10,58 L70,58 C66,52 64,46 63,36 C62,22 54,10 40,10 Z"
                fill="rgba(232,160,122,.25)" stroke="#2A2723" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M37,10 C37,7 43,7 43,10" stroke="#2A2723" stroke-width="2" stroke-linecap="round" fill="none"/>
          <circle cx="40" cy="64" r="4.5" fill="rgba(232,160,122,.5)" stroke="#2A2723" stroke-width="2"/>
          <path d="M68,30 C72,28 74,24 73,20" stroke="#2A2723" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2" fill="none"/>
          <path d="M12,30 C8,28 6,24 7,20"  stroke="#2A2723" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2" fill="none"/>
        </svg>
      </div>
      <div class="drawer-app-name">Pavlovian</div>
      <div class="drawer-tagline">break time reminders</div>
      <div class="drawer-byline">by HST</div>
    </div>

    <hr class="dashed-div">
    <div style="height:6px"></div>

    <!-- Settings item -->
    <div class="drawer-item">
      <div class="icon">&#9881;</div>
      <span class="item-label">Settings</span>
      <span class="chev">›</span>
    </div>

    <div class="drawer-spacer"></div>

    <!-- Footer -->
    <hr class="dashed-div">
    <div class="drawer-credits">
      rooster sound attribute to<br>Ribhav Agrawal @ pixabay.com<br><br>
      cuckoo sound attribute to<br>Monkay @ freesound.org
    </div>
    <hr class="dashed-div">
    <div class="drawer-version">Pavlovian v1.5.21</div>

  </div>

</div>
</body>
</html>
