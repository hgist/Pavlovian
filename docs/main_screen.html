<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>Pavlovian — Main Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:       #FBF7EE;
    --paper-light: #FFFDF7;
    --ink:         #2A2723;
    --ink-muted:   #6B655C;
    --ink-hair:    #B7AD9B;
    --terracotta:  #E8A07A;
    --warning:     #A8401A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F0EEE9;
    display: flex; justify-content: center; padding: 24px 0;
    font-family: 'Patrick Hand', cursive;
    color: var(--ink);
  }
  .phone {
    width: 370px;
    min-height: 740px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 6px 6px 0 rgba(42,39,35,.15);
    display: flex; flex-direction: column;
  }

  /* ── Header ── */
  .header {
    display: flex; align-items: flex-start;
    padding: 16px 14px 8px 12px;
  }
  .hamburger { font-size: 22px; margin-right: 6px; margin-top: 2px; cursor: pointer; color: var(--ink); }
  .header-text { flex: 1; }
  .header-text h1 {
    font-family: 'Architects Daughter', cursive;
    font-size: 22px; letter-spacing: .3px; font-weight: normal;
  }
  .header-text .sub {
    font-family: 'Patrick Hand', cursive;
    font-size: 12px; color: var(--ink-muted);
  }
  .all-switch {
    text-align: center;
  }
  .pill-switch {
    width: 44px; height: 24px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
  }
  .pill-switch.on  { background: var(--terracotta); }
  .pill-switch.off { background: transparent; }
  .pill-dot {
    width: 17px; height: 17px;
    background: var(--ink);
    border-radius: 50%;
    position: absolute; top: 1.5px;
  }
  .pill-switch.on  .pill-dot { right: 2px; }
  .pill-switch.off .pill-dot { left: 2px; }
  .all-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; color: var(--ink-muted); letter-spacing: .5px;
    margin-top: 2px;
  }

  /* ── Day chips — spread evenly across full screen width (v1.5.19) ── */
  .day-chips {
    display: flex; gap: 4px;
    padding: 6px 10px 0;
  }
  .day-chip {
    flex: 1;
    text-align: center;
    padding: 4px 0;
    border: 2px solid var(--ink);
    border-radius: 999px;
    font-family: 'Patrick Hand', cursive;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .day-chip.active {
    background: rgba(232,160,122,.25);
    font-weight: 600;
  }
  .day-chip.off {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-hair);
    text-decoration: line-through;
    cursor: default;
  }

  /* ── Day master card ── */
  .day-master {
    margin: 8px 14px;
    padding: 8px 10px;
    border: 2px solid var(--ink);
    border-radius: 14px;
    background: var(--paper-light);
    display: flex; align-items: center; gap: 8px;
    box-shadow: 2px 2px 0 rgba(42,39,35,.15);
  }
  .pen-check {
    width: 20px; height: 20px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; cursor: pointer;
    background: white;
  }
  .pen-check.on { background: rgba(232,160,122,.3); }
  .day-master-text .title { font-size: 15px; line-height: 1.1; }
  .day-master-text .hint  { font-size: 12px; color: var(--ink-muted); }

  /* ── Legend ── */
  .legend {
    padding: 4px 18px;
    font-family: 'Caveat', cursive;
    font-size: 14px; color: var(--warning);
    transform: rotate(-2deg);
  }

  /* ── Dashed separator ── */
  .dashed-sep {
    margin: 4px 18px 6px;
    border: none;
    border-top: 2px dashed var(--ink-hair);
  }

  /* ── Slot cards ── */
  .slot-list { flex: 1; overflow-y: auto; padding: 4px 14px 24px; }
  .slot-card {
    border: 2px solid var(--ink);
    border-radius: 14px;
    background: var(--paper-light);
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 2px 2px 0 rgba(42,39,35,.15);
  }
  .slot-card .pen-check { width: 16px; height: 16px; font-size: 11px; }
  .slot-time-col { display: flex; flex-direction: column; }
  .slot-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 23px; line-height: 1.1;
  }
  .slot-dur {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; font-weight: 700; color: var(--ink-muted); letter-spacing: .4px;
  }
  .slot-info { flex: 1; margin-left: 6px; }
  .slot-label { font-size: 16px; line-height: 1.15; }
  .slot-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--ink-muted);
  }
  /* v1.7.3: bigger button, tighter padding/gap (padding 6/12 → 4/9, font 15 → 19). */
  .btn-start {
    padding: 4px 9px;
    margin-left: -3px;
    border: 1.5px solid var(--ink);
    border-radius: 9px;
    font-family: 'Caveat', cursive;
    font-size: 19px; font-weight: 600;
    letter-spacing: .3px;
    cursor: pointer; background: transparent;
  }
  .edit-chevron {
    font-family: 'Caveat', cursive;
    font-size: 15px; color: var(--ink-muted);
  }
</style>
</head>
<body>

<div class="phone">

  <!-- Header -->
  <div class="header">
    <span class="hamburger">☰</span>
    <div class="header-text">
      <h1>Timers</h1>
      <div class="sub">3 of 3 active · Sunday</div>
    </div>
    <div class="all-switch">
      <div class="pill-switch on"><div class="pill-dot"></div></div>
      <div class="all-label">ALL ON</div>
    </div>
  </div>

  <!-- Day chips -->
  <div class="day-chips">
    <div class="day-chip active">Sun</div>
    <div class="day-chip">Mon</div>
    <div class="day-chip">Tue</div>
    <div class="day-chip">Wed</div>
    <div class="day-chip">Thu</div>
    <div class="day-chip off">Fri</div>
    <div class="day-chip off">Sat</div>
  </div>

  <!-- Day master card -->
  <div class="day-master">
    <div class="pen-check on">&#x2713;</div>
    <div class="day-master-text">
      <div class="title">Sunday timers</div>
      <div class="hint">pauses every timer just for today</div>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">&darr; runs on each enabled day</div>

  <!-- Dashed separator -->
  <hr class="dashed-sep">

  <!-- Slot cards -->
  <div class="slot-list">

    <!-- Slot 1 -->
    <div class="slot-card">
      <div class="pen-check on" style="width:16px;height:16px;font-size:11px;">&#x2713;</div>
      <div class="slot-time-col">
        <div class="slot-time">10:00</div>
        <div class="slot-dur">20 min</div>
      </div>
      <div class="slot-info">
        <div class="slot-label">Morning Break</div>
        <div class="slot-status">every enabled day</div>
      </div>
      <button class="btn-start">&#9654; start</button>

    </div>

    <!-- Slot 2 -->
    <div class="slot-card">
      <div class="pen-check on" style="width:16px;height:16px;font-size:11px;">&#x2713;</div>
      <div class="slot-time-col">
        <div class="slot-time">12:30</div>
        <div class="slot-dur">45 min</div>
      </div>
      <div class="slot-info">
        <div class="slot-label">Lunch Break</div>
        <div class="slot-status">every enabled day</div>
      </div>
      <button class="btn-start">&#9654; start</button>

    </div>

    <!-- Slot 3 -->
    <div class="slot-card">
      <div class="pen-check on" style="width:16px;height:16px;font-size:11px;">&#x2713;</div>
      <div class="slot-time-col">
        <div class="slot-time">15:00</div>
        <div class="slot-dur">20 min</div>
      </div>
      <div class="slot-info">
        <div class="slot-label">Afternoon Break</div>
        <div class="slot-status">every enabled day</div>
      </div>
      <button class="btn-start">&#9654; start</button>

    </div>

  </div>

</div>

</body>
</html>
