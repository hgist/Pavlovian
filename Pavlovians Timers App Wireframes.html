<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timers · wireframes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Architects+Daughter&family=Caveat:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; font-family: "Patrick Hand", system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wireframes/phone-frame.jsx"></script>
<script type="text/babel" src="wireframes/option-a.jsx"></script>

<script type="text/babel" data-presets="env,react">
const PHONE_W = 300;
const PHONE_H = 600;

function ArtboardPhone({ children }) {
  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: '#f0eee9',
    }}>
      <PhoneFrame width={PHONE_W} height={PHONE_H}>
        {children}
      </PhoneFrame>
    </div>
  );
}

function App() {
  const ABW = 340;
  const ABH = 640;
  return (
    <DesignCanvas
      title="Timers · Option A"
      subtitle="day tabs + list · 3 timers/day · per-day enable/disable · no Saturday"
    >
      <DCSection
        id="main"
        title="Main screen — four states"
        subtitle="three scopes: global → day → timer · all three must be on to fire"
      >
        <DCArtboard id="opt-a-on" label="A1 · all on" width={ABW} height={ABH}>
          <ArtboardPhone><OptionA globalEnabled={true} dayEnabled={true}/></ArtboardPhone>
        </DCArtboard>
        <DCArtboard id="opt-a-timer-off" label="A2 · lunch off (all week)" width={ABW} height={ABH}>
          <ArtboardPhone>
            <OptionA globalEnabled={true} dayEnabled={true} timers={[
              { time: '09:00', label: 'Morning check-in', on: true },
              { time: '13:00', label: 'Lunch break',      on: false },
              { time: '17:30', label: 'Wrap-up',          on: true },
            ]}/>
          </ArtboardPhone>
        </DCArtboard>
        <DCArtboard id="opt-a-day-off" label="A3 · day paused" width={ABW} height={ABH}>
          <ArtboardPhone><OptionA globalEnabled={true} dayEnabled={false}/></ArtboardPhone>
        </DCArtboard>
        <DCArtboard id="opt-a-global-off" label="A4 · ALL off" width={ABW} height={ABH}>
          <ArtboardPhone><OptionA globalEnabled={false} dayEnabled={true}/></ArtboardPhone>
        </DCArtboard>
      </DCSection>

      <DCPostIt left={20} top={140} rotate={-3}>
        three scopes:
        · ALL switch (top-right) =
          kill switch for the whole app
        · day checkbox = pause today
        · row checkbox = off all week
        all three must be ON to fire.
      </DCPostIt>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
