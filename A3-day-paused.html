<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pavlovian · A3 · day paused</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Architects+Daughter&family=Caveat:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; font-family: "Patrick Hand", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  .stage { min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px; }
  .label { font-family: "Architects Daughter", sans-serif;
    color: #2a2723; font-size: 18px; letter-spacing: 0.5px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
function PhoneFrame({ children, width = 300, height = 620 }) {
  return (
    <div style={{
      width, height,
      borderRadius: 32,
      border: '2.5px solid #2a2723',
      background: '#fbf7ee',
      boxShadow: '4px 6px 0 rgba(42,39,35,0.12)',
      padding: '14px 6px 10px',
      boxSizing: 'border-box',
      display: 'flex',
      flexDirection: 'column',
      position: 'relative',
      fontFamily: '"Patrick Hand", "Comic Sans MS", system-ui, sans-serif',
    }}>
      <div style={{
        position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)',
        width: 60, height: 5, borderRadius: 3, border: '1.5px solid #2a2723',
      }} />
      <div style={{
        display: 'flex', justifyContent: 'space-between',
        padding: '8px 14px 2px', fontSize: 11,
        color: '#6b655c', letterSpacing: 0.5,
        fontFamily: '"JetBrains Mono", ui-monospace, monospace',
      }}>
        <span>9:30</span><span>•••</span><span>▮▮</span>
      </div>
      <div style={{
        flex: 1,
        border: '1.5px dashed #b7ad9b',
        borderRadius: 18,
        margin: '4px 6px 8px',
        overflow: 'hidden',
        display: 'flex',
        flexDirection: 'column',
        background: '#fffdf7',
        position: 'relative',
      }}>
        {children}
      </div>
      <div style={{
        width: 90, height: 4, borderRadius: 2,
        background: '#2a2723', opacity: 0.5,
        margin: '0 auto',
      }} />
    </div>
  );
}

function Checkbox({ checked, small }) {
  const s = small ? 18 : 22;
  return (
    <div style={{
      width: s, height: s, borderRadius: 5,
      border: '2px solid #2a2723',
      background: checked ? '#e8a07a' : 'transparent',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      flexShrink: 0,
    }}>
      {checked && (
        <svg width={s - 8} height={s - 8} viewBox="0 0 14 14">
          <path d="M2 7 L6 11 L12 3" fill="none" stroke="#2a2723"
            strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
    </div>
  );
}

function BreakButton({ running }) {
  return (
    <div style={{
      fontSize: 12,
      fontFamily: '"Caveat", cursive',
      fontWeight: 600,
      border: '1.5px solid #2a2723',
      borderRadius: 8,
      padding: '3px 9px',
      background: running ? '#e8a07a' : 'transparent',
      color: '#2a2723',
      boxShadow: running ? '1px 1px 0 #2a2723' : 'none',
      flexShrink: 0,
      whiteSpace: 'nowrap',
      letterSpacing: 0.3,
    }}>
      {running ? '■ clear' : '▶ start'}
    </div>
  );
}

function OptionA({ globalEnabled = true, dayEnabled = true, timers }) {
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu'];
  const offDays = ['Fri', 'Sat'];
  const active = 1; // Mon

  const defaults = [
    { time: '10:00', label: 'Morning Break',   duration: 20, on: true, running: false, remaining: null },
    { time: '12:30', label: 'Lunch Break',     duration: 45, on: true, running: false, remaining: null },
    { time: '15:00', label: 'Afternoon Break', duration: 20, on: true, running: false, remaining: null },
  ];
  const list = timers || defaults;
  const enabledCount = list.filter(t => t.on).length;
  const dayActuallyOn = globalEnabled && dayEnabled;

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', position: 'relative' }}>

      {/* Header */}
      <div style={{ padding: '14px 18px 6px', display: 'flex', alignItems: 'flex-start', gap: 10 }}>
        <div style={{ flex: 1 }}>
          <div style={{
            fontFamily: '"Architects Daughter", "Patrick Hand", sans-serif',
            fontSize: 22, color: '#2a2723', letterSpacing: 0.3,
          }}>Timers</div>
          <div style={{ fontSize: 12, color: '#6b655c', marginTop: -2 }}>
            {!globalEnabled
              ? 'all timers off'
              : dayEnabled
                ? `${enabledCount} of ${list.length} active · Mon`
                : 'paused for Mon'}
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
          <div style={{
            width: 46, height: 24, borderRadius: 999,
            border: '2px solid #2a2723',
            background: globalEnabled ? '#e8a07a' : 'transparent',
            position: 'relative',
            boxShadow: '2px 2px 0 rgba(42,39,35,0.2)',
          }}>
            <div style={{
              position: 'absolute', top: 1, left: globalEnabled ? 22 : 1,
              width: 18, height: 18, borderRadius: '50%',
              background: '#2a2723',
            }} />
          </div>
          <div style={{
            fontSize: 9, color: '#6b655c',
            fontFamily: '"JetBrains Mono", monospace', letterSpacing: 0.5,
          }}>
            {globalEnabled ? 'ALL ON' : 'ALL OFF'}
          </div>
        </div>
      </div>

      {/* Day chips */}
      <div style={{
        display: 'flex', gap: 5, padding: '4px 14px 10px',
        overflowX: 'auto', opacity: globalEnabled ? 1 : 0.5,
      }}>
        {days.map((d, i) => (
          <div key={d} style={{
            padding: '5px 10px',
            border: '2px solid #2a2723',
            borderRadius: 999,
            background: i === active ? '#2a2723' : 'transparent',
            color: i === active ? '#fbf7ee' : '#2a2723',
            fontSize: 13,
            boxShadow: i === active ? '2px 2px 0 rgba(42,39,35,0.2)' : 'none',
            flexShrink: 0, position: 'relative',
          }}>
            {d}
            {i !== active && (
              <span style={{
                position: 'absolute', top: 2, right: 4,
                width: 5, height: 5, borderRadius: '50%',
                background: '#e8a07a',
              }} />
            )}
          </div>
        ))}
        {offDays.map(d => (
          <div key={d} style={{
            padding: '5px 8px',
            color: '#b7ad9b',
            fontSize: 13,
            fontFamily: '"JetBrains Mono", monospace',
            textDecoration: 'line-through',
            flexShrink: 0,
          }}>{d}</div>
        ))}
      </div>

      {/* Day master toggle — unchecked (day is paused) */}
      <div style={{
        margin: '0 14px 8px',
        border: '2px solid #2a2723',
        borderRadius: 14,
        padding: '10px 12px',
        display: 'flex', alignItems: 'center', gap: 10,
        background: dayActuallyOn ? '#fffdf7' : 'rgba(42,39,35,0.06)',
        opacity: globalEnabled ? 1 : 0.55,
        boxShadow: '2px 2px 0 rgba(42,39,35,0.15)',
      }}>
        <Checkbox checked={dayEnabled} />
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 15, color: '#2a2723', lineHeight: 1.1 }}>Monday timers</div>
          <div style={{ fontSize: 12, color: '#a8401a', marginTop: 2, fontFamily: '"Caveat", cursive' }}>
            ✕ paused for today
          </div>
        </div>
      </div>

      {/* Legend */}
      <div style={{
        margin: '0 18px 4px',
        fontFamily: '"Caveat", cursive', fontSize: 13, color: '#a8401a',
      }}>
        <span style={{ transform: 'rotate(-2deg)', display: 'inline-block' }}>
          ↓ each break runs every Sun–Thu
        </span>
      </div>
      <div style={{ borderTop: '1.5px dashed #b7ad9b', margin: '0 18px 8px' }} />

      {/* Timer list — all dimmed because day is paused */}
      <div style={{ flex: 1, padding: '0 14px 70px', display: 'flex', flexDirection: 'column', gap: 10, overflow: 'auto' }}>
        {list.map((t, i) => {
          const dim = !dayActuallyOn || !t.on;
          return (
            <div key={i} style={{
              border: '2px solid #2a2723',
              borderRadius: 14,
              padding: '10px 12px',
              display: 'flex', alignItems: 'center', gap: 8,
              background: dim ? 'rgba(42,39,35,0.04)' : '#fffdf7',
              opacity: dim ? 0.5 : 1,
              boxShadow: dim ? 'none' : '2px 2px 0 rgba(42,39,35,0.15)',
            }}>
              <Checkbox checked={t.on} small />
              <div style={{ display: 'flex', flexDirection: 'column', minWidth: 56, gap: 1 }}>
                <div style={{
                  fontFamily: '"JetBrains Mono", monospace',
                  fontSize: 20, color: '#2a2723', lineHeight: 1.1,
                  textDecoration: dim ? 'line-through' : 'none',
                }}>{t.time}</div>
                <div style={{
                  fontFamily: '"JetBrains Mono", monospace',
                  fontSize: 9, color: '#6b655c', letterSpacing: 0.4,
                }}>{t.duration} min</div>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{
                  fontSize: 13, color: '#2a2723',
                  whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                }}>{t.label}</div>
                <div style={{
                  fontSize: 10, color: '#6b655c',
                  fontFamily: '"JetBrains Mono", monospace', marginTop: 1,
                }}>
                  {t.on ? 'every Sun–Thu' : 'off — whole week'}
                </div>
              </div>
              {/* No start/clear button — day is paused, dim=true for all */}
              <div style={{
                fontFamily: '"Caveat", cursive', fontSize: 15, color: '#6b655c', flexShrink: 0,
              }}>edit ›</div>
            </div>
          );
        })}
      </div>

      {/* FAB */}
      <div style={{
        position: 'absolute', bottom: 16, right: 16,
        width: 50, height: 50, borderRadius: '50%',
        border: '2.5px solid #2a2723',
        background: '#e8a07a',
        boxShadow: '3px 3px 0 #2a2723',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: 26, color: '#2a2723', lineHeight: 1,
      }}>+</div>
    </div>
  );
}

function App() {
  return (
    <div className="stage">
      <div className="label">A3 · day paused</div>
      <PhoneFrame width={300} height={620}>
        <OptionA globalEnabled={true} dayEnabled={false} />
      </PhoneFrame>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
